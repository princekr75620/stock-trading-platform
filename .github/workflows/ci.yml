name: CI Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Java 17 + Node 22 Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Compile Java backend
        run: bash compile.sh

      - name: Run complete Java unit, security, DB & HTTP E2E test suite
        run: npm test

      - name: Run TypeScript type check (lint)
        run: npm run lint

      - name: Build production frontend & Express gateway bundle
        run: npm run build
